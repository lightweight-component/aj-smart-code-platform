spring:
  h2:
    console:
      # 启用 H2 Web Console，启动后访问 http://localhost:8080/h2-console
      enabled: true
      path: /h2-console

# 数据库连接（从本模块根目录启动时，数据随源码保存在 src/main/resources/data/）
db:
  url: jdbc:h2:file:./src/main/resources/data/aj-dataservice;MODE=MySQL;DATABASE_TO_UPPER=FALSE;DB_CLOSE_ON_EXIT=FALSE
  user: sa
  psw:
